name: Deploy Mission 27

on:
  push:
    branches:
      - main

jobs:
  build-and-release-flutter:
    name: Build Flutter Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Get Flutter dependencies
        run: |
          cd frontend/mission27
          flutter pub get

      - name: Run Riverpod Codegen
        run: |
          cd frontend/mission27
          dart run build_runner build --delete-conflicting-outputs

      - name: Build APK
        run: |
          cd frontend/mission27
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mission27-release-apk
          path: frontend/mission27/build/app/outputs/flutter-apk/app-release.apk

  deploy-backend:
    name: Build & Deploy Backend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Lowercase Image Tag
        run: |
          echo "IMAGE_TAG=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')/backend:latest" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          dockerfile: Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: SSH Deploy to Oracle VM
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
        with:
          host: ${{ secrets.VM_IP }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          envs: IMAGE_TAG
          script: |
            mkdir -p ~/mission_27
            cd ~/mission_27
            
            # Create production docker-compose file dynamically
            cat << EOF > docker-compose.yml
            version: "3.9"
            services:
              db:
                image: postgres:16-alpine
                container_name: m27_db
                restart: unless-stopped
                environment:
                  POSTGRES_DB: mission27
                  POSTGRES_USER: m27_user
                  POSTGRES_PASSWORD: m27_password
                  TZ: Asia/Karachi
                ports:
                  - "5432:5432"
                volumes:
                  - pgdata:/var/lib/postgresql/data
                healthcheck:
                  test: ["CMD-SHELL", "pg_isready -U m27_user -d mission27"]
                  interval: 10s
                  timeout: 5s
                  retries: 5
              backend:
                image: $IMAGE_TAG
                container_name: m27_backend
                restart: unless-stopped
                ports:
                  - "8000:8000"
                environment:
                  - TZ=Asia/Karachi
                env_file:
                  - .env
                depends_on:
                  db:
                    condition: service_healthy
            volumes:
              pgdata:
            EOF

            # Setup basic environment variables if .env doesn't exist
            if [ ! -f .env ]; then
              echo "DATABASE_URL=postgresql://m27_user:m27_password@db:5432/mission27" > .env
              echo "DATABASE_ECHO=false" >> .env
              echo "SECRET_KEY=${{ secrets.BACKEND_SECRET_KEY }}" >> .env
              echo "ALGORITHM=HS256" >> .env
              echo "ACCESS_TOKEN_EXPIRE_MINUTES=30" >> .env
              echo "REFRESH_TOKEN_EXPIRE_DAYS=7" >> .env
              echo "ENVIRONMENT=production" >> .env
              echo "DEBUG=false" >> .env
              echo "ALLOWED_ORIGINS=[\"*\"]" >> .env
              echo "GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}" >> .env
            fi

            # Login to GitHub Container Registry on VM
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Pull and restart containers
            docker compose pull
            docker compose down
            docker compose up -d

            # Wait for database to be ready and run migrations
            docker exec m27_backend alembic upgrade head
