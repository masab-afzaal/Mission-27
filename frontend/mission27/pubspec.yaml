name: mission27
description: Mission 27 – Personal Growth Operating System
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^3.3.2
  riverpod_annotation: ^4.0.3

  # Navigation
  go_router: ^13.2.0

  # HTTP
  dio: ^5.7.0

  # Storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.0

  # Models
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

  # UI / Animation
  flutter_animate: ^4.5.0
  fl_chart: ^0.68.0

  # Notifications
  flutter_local_notifications: ^17.2.1
  timezone: ^0.9.4

  # Utilities
  intl: ^0.19.0
  uuid: ^4.4.0
  equatable: ^2.0.5
  dartz: ^0.10.1
  record: ^7.1.0
  path_provider: ^2.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  riverpod_generator: ^4.0.4
  build_runner: ^2.15.0
  freezed: ^3.2.5
  json_serializable: ^6.9.5

flutter:
  uses-material-design: true
  assets:
    - assets/images/
