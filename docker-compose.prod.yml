version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: m27_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: mission27
      POSTGRES_USER: m27_user
      POSTGRES_PASSWORD: m27_password
      TZ: Asia/Karachi
    volumes:
      - pgdata:/var/lib/postgresql/data
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: m27_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - TZ=Asia/Karachi
    env_file:
      - ./backend/.env
    depends_on:
      - db

  pgadmin:
    image: dpage/pgadmin4
    container_name: m27_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@m27.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - db

volumes:
  pgdata:
