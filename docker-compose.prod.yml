version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: m27_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: mission27
      POSTGRES_USER: m27_user
      POSTGRES_PASSWORD: m27_password
      TZ: Asia/Karachi
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U m27_user -d mission27"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: m27_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - TZ=Asia/Karachi
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
